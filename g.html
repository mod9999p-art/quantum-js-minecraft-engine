<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 3D - Ultimate Quantum JS Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; user-select: none; }
        #hud {
            position: absolute; top: 10px; left: 10px; color: #00ffcc;
            background: rgba(0, 0, 0, 0.9); padding: 15px; border-radius: 8px;
            border: 1px solid #00ffcc; pointer-events: none;
            box-shadow: 0 0 25px rgba(0,255,204,0.4); z-index: 10;
        }
        h3 { margin: 0 0 5px 0; color: #fff; }
        .ping-box { color: #ff0055; font-weight: bold; font-size: 1.15em; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            transform: translate(-50%, -50%); color: white; font-size: 20px;
            pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="crosshair">+</div>
    <div id="hud">
        <h3>🌌 ULTIMATE QUANTUM JS ENGINE</h3>
        <p>Status: <span style="color: #00ff00;">FULL ENGINE ACTIVE</span></p>
        <p>Controls: WASD = Move | Space = Jump | Click = Lock View</p>
        <p>Actions: Left Click = Break Block | Right Click = Place Block</p>
        <p>Speed: <b>0.1</b> | Ping: <span id="pingVal" class="ping-box">0.00001 ms</span></p>
        <p id="stats">FPS: 60 | Blocks Loaded: Active</p>
    </div>

    <!-- โหลด Three.js จาก CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Scene, Camera และ Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // 2. ระบบสร้างโลกและบล็อก (World & Interactive Blocks)
        const blockSize = 1;
        const worldSize = 40;
        const geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
        const material = new THREE.MeshLambertMaterial({ color: 0x2ecc71 });

        // ใช้ Group เก็บวัตถุเพื่อให้สามารถเพิ่ม/ลดบล็อกแบบเรียลไทม์ได้
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const blocks = [];
        for (let x = -worldSize/2; x < worldSize/2; x++) {
            for (let z = -worldSize/2; z < worldSize/2; z++) {
                let y = Math.floor(Math.sin(x * 0.2) * Math.cos(z * 0.2) * 2);
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x, y, z);
                worldGroup.add(mesh);
                blocks.push(mesh);
            }
        }

        // 3. ระบบควบคุมการเคลื่อนที่ (Speed = 0.1 + Physics Gravity & Jump)
        const moveSpeed = 0.1;
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let velocityY = 0;
        const gravity = 0.005;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
            if (e.code === 'Space' && camera.position.y <= 2.1) {
                velocityY = 0.1; // กระโดด
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
        });

        // 4. ระบบควบคุมมุมมองเมาส์ (Pointer Lock API สมจริงเหมือนเกมจริงๆ)
        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        let yaw = 0, pitch = 0;
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

            const direction = new THREE.Vector3(
                Math.sin(yaw) * Math.cos(pitch),
                Math.sin(pitch),
                Math.cos(yaw) * Math.cos(pitch)
            );
            camera.lookAt(camera.position.clone().add(direction));
        });

        // 5. ระบบ Raycast วางและทำลายบล็อก
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0); // ตรงกลางจอ

        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body) return;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(worldGroup.children);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (e.button === 0) {
                    // คลิกซ้าย: ทำลายบล็อก
                    worldGroup.remove(intersect.object);
                } else if (e.button === 2) {
                    // คลิกขวา: วางบล็อกใหม่
                    const newMesh = new THREE.Mesh(geometry, new THREE.MeshLambertMaterial({ color: 0xe67e22 }));
                    const position = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5));
                    newMesh.position.set(Math.round(position.x), Math.round(position.y), Math.round(position.z));
                    worldGroup.add(newMesh);
                }
            }
        });
        window.addEventListener('contextmenu', e => e.preventDefault()); // ปิดเมนูคลิกขวาปกติ

        // 6. ระบบอัปเดตปิงระดับ Quantum (0.00001 ms)
        const pingElement = document.getElementById('pingVal');
        function updateQuantumPing() {
            const quantumPing = (0.00001 + Math.random() * 0.00008).toFixed(5);
            pingElement.innerText = `${quantumPing} ms`;
        }

        // 7. Game Loop ประสิทธิภาพสูง
        let lastTime = performance.now();
        let frameCount = 0;

        function animate(currentTime) {
            requestAnimationFrame(animate);

            // คำนวณทิศทางการเคลื่อนที่ตามมุมมองกล้องด้วยความเร็ว 0.1
            const moveDir = new THREE.Vector3();
            const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
            const side = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

            if (keys.w) camera.position.addScaledVector(forward, -moveSpeed);
            if (keys.s) camera.position.addScaledVector(forward, moveSpeed);
            if (keys.a) camera.position.addScaledVector(side, -moveSpeed);
            if (keys.d) camera.position.addScaledVector(side, moveSpeed);

            // ฟิสิกส์แรงโน้มถ่วง
            velocityY -= gravity;
            camera.position.y += velocityY;
            if (camera.position.y < 2) {
                camera.position.y = 2;
                velocityY = 0;
            }

            updateQuantumPing();

            frameCount++;
            if (currentTime - lastTime >= 1000) {
                document.getElementById('stats').innerText = `FPS: ${frameCount} | Blocks Active: ${worldGroup.children.length}`;
                frameCount = 0;
                lastTime = currentTime;
            }

            renderer.render(scene, camera);
        }

        animate(performance.now());

        // ปรับขนาดหน้าจออัตโนมัติ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
